<title>天龙八部游戏帮助</title>

<style type="text/css">

-->
</style>

<body>
<p class="STYLE4"><span class="STYLE3"><strong><img src="arrow.gif" width="19" height="18" align="absmiddle"></strong>称号</span><br>
  角色的头衔，玩家可以通过加入门派、做任务、加入帮会获得帮会称号与职位，还可以拜师。<br>
结婚、结拜获得各类不同名称的头衔，并且各类的头衔显示颜色不同，玩家获得多个称号后可以任意隐藏或者更换称号。</p>
<p class="STYLE4"><span class="STYLE3"><strong><img src="arrow.gif" width="19" height="18" align="absmiddle"></strong>帮会</span><br>
玩家加入帮会的名称，显示在江湖中的地位。玩家可以自主选择加入他人建立的帮会，也可以自己建立帮会招收朋友加入帮会。</p>
<p class="STYLE4"><span class="STYLE3"><strong><img src="arrow.gif" width="19" height="18" align="absmiddle"></strong>师徒</span><br>
玩家等级达到一定级别后，可以收取低等级的徒弟，通过师徒获得江湖声望与善恶值。</p>
<p class="STYLE4"><span class="STYLE3"><strong><img src="arrow.gif" width="19" height="18" align="absmiddle"></strong>配偶</span><br>
热恋的新人一对，在月老处完婚后。对方就成为你在游戏中的配偶，配偶实行一夫一妻制。 </p>
<p class="STYLE4"><span class="STYLE3"><strong><img src="arrow.gif" width="19" height="18" align="absmiddle"></strong>结拜 </span><br>
角色的结拜对象，游戏中角色可以和朋友一起去结拜为兄弟。</p>
</body>
