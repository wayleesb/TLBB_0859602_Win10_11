<h1 class="ArtTitle STYLE1 STYLE2"><strong><img src="arrow.gif" width="19" height="18" align="absmiddle"></strong>系统界面</h1>
<p class="STYLE3">点击系统图标或者按下ESC键可以打开系统界面。<br>
在系统界面中有显示设置、声音设置、游戏性设置、帮助、退出游戏、返回游戏几个选项。<br>
点击显示设置可以修改关于游戏中显示方面的各种状态。<br>
点击声音设置可以修改关于游戏声音音效方面的内容。<br>
点击游戏性设置可以设置游戏的各种性能。<br>
点击帮助可以进入游戏帮助主界面。<br>
点击退出游戏可弹出退出游戏框进行退出游戏操作。<br>
点击返回游戏界面可以直接返回游戏中。</p>
