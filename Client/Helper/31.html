  <br>
  <span class="STYLE3"><img src="arrow.gif" width="19" height="18" align="absmiddle">主技能栏</span><strong><br>
  </strong>在聊天输入栏的上方，以F1～F10为快捷键；<br>
  <span class="STYLE1"><span class="STYLE3"><br>
  <img src="arrow.gif" width="19" height="18" align="absmiddle"></span><strong>副技能栏</strong></span><strong><br>
  </strong>在主技能栏上方，可以通过点击主技能栏左侧的<img src="Snap1.jpg" width="15" height="15">按钮来打开/隐藏，以Alt+1～Alt+0为快捷键；<br>
  <br>
    <span class="STYLE3"><img src="arrow.gif" width="19" height="18" align="absmiddle">扩展技能栏</span><strong><br>
    </strong>在屏幕的右侧，竖直排列。<br>
