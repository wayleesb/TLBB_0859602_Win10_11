<p class="STYLE2">你可以找洛阳－彭怀玉（177，184）、楼兰－克里木（75，162）或束河古镇－荆嵌实（135，85）将3～5颗同级同样的宝石合成为一颗高一级的宝石，合成有一定机率失败，使用宝石合成符可以提高合成的成功率。<br>
宝石合成符分为低级宝石合成符和高级宝石合成符。低级宝石合成符可以增加合成4级（包括4级）以下宝石的成功率，而高级宝石合成符可以增加合成5级（包括5级）以上宝石的成功率。</p>
