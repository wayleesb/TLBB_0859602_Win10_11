<h1 class="ArtTitle STYLE1 STYLE2"><strong><span class="STYLE3"><img src="arrow.gif" width="19" height="18" align="absmiddle"></span></strong><span class="STYLE3">声音设置</span></h1>
<p class="STYLE3">声音设置有以下功能：</p>
<p class="STYLE3">可以调节背景音效、环境音效、技能音效、事件音效并且可以根据自己的意愿选择是否对游戏进行静音，非常人性化。</p>
<p class="STYLE3">背景音效：场景音乐。</p>
<p class="STYLE3">环境音效：在特定环境中出现的特定音效。</p>
<p class="STYLE3">技能音效：施放技能时发出的声音。</p>
<p class="STYLE3">事件音效：升级、领取任务等情况下发出的声音。</p>
<p class="STYLE3">&nbsp;</p>
