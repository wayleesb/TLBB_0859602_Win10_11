<h1 class="ArtTitle STYLE1 STYLE2">查看玩家详细资料</h1>
<p><span class="STYLE7"><span class="STYLE6"><strong><img src="arrow.gif" width="19" height="18" align="absmiddle"></strong>显示选项</span><br>
</span><span class="STYLE3">可以调整：游戏地形阴影效果、人物阴影效果、全屏抗锯齿效果、显示模型数、物体动画效果、全屏泛光效果和柔体效果。</span></p>
<p class="STYLE3"><strong><span class="STYLE6"><strong><img src="arrow.gif" width="19" height="18" align="absmiddle"></strong>文理选项</span><br>
  </strong>调整游戏颜色质量和采样质量。</p>
<p class="STYLE3"><strong><span class="STYLE6"><strong><img src="arrow.gif" width="19" height="18" align="absmiddle"></strong>其他</span><br>
</strong>可调整为：垂直同步、全屏或者窗口模式。 <br>
其中窗口模式时可以调整游戏分辨率，分别为：当前、800×600、1024×768、1280×1024四种。</p>
