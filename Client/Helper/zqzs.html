<p class="STYLE4"><strong><img src="arrow.gif" width="19" height="18" align="absmiddle"><span class="STYLE8">坐骑系统</span> </strong></p>
<p class="STYLE4">《天龙八部》中九大门派各有代表自己门派特色的专属坐骑。</p>
<p class="STYLE4"><br>
<strong><span class="STYLE6"><strong><img src="arrow.gif" width="19" height="18" align="absmiddle"></strong>使用坐骑条件</span></strong><strong><br>
  </strong>1.必须是该骑乘相对应的门派的弟子。<br>
  2.等级需达到骑乘所要求的等级，低级坐骑需要40级，高级坐骑需要60级。<br>
  3.需要学习对应的骑乘技能才能使用坐骑。<br>
4.需要在本门派内购买坐骑。<br>
5.需要装备坐骑到人物的坐骑栏内。<strong><br>
</strong></p>
