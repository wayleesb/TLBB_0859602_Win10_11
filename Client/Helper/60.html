<p class="STYLE4"><strong><span class="STYLE3">坐骑系统</span> </strong></p>
<p class="STYLE4">《天龙八部》中九大门派各有代表自己门派特色的专属坐骑。<br>
    <strong><br>
      <img src="arrow.gif" width="19" height="18" align="absmiddle"><span class="STYLE6">骑乘的作用</span><br>
</strong>骑乘的主要作用，是提高人物行走速度。</p>
<p class="STYLE1"><span class="STYLE5"><span class="STYLE6"><strong><img src="arrow.gif" width="19" height="18" align="absmiddle"></strong>骑乘条件</span><br>
  </span><span class="STYLE7">1、必须是该骑乘相对应的本门派弟子。<br>
  2、人物等级需达到骑乘所要求的等级。<br>
  3、人物需要学习骑乘需要的骑乘技能才能使用坐骑。<br>
  4、人物需要在本门派内购买坐骑，装备到人物骑乘栏内。</span><strong><br>
</strong></p>
