<p class="STYLE3">玩家店铺有两个存钱的银行，一个是本金银行，一个是盈利资金银行； <br>
除系统收取的金钱之外，还需要玩家充入一定的金额，此金额可支取（相当多了个银行，称之为店铺本金，店铺本金=开店（增柜台）费用）。店铺本金不允许支出，只允许充入，每次充入需要缴纳3%的投资税（计算完投资税小于1铜币按1铜币扣除）。赢利的钱为赢利资金，可充入可支出，充入时同样要缴纳3%的投资税。<br>
重要的是不能让本金过低，当玩家店铺本金不足以支付<span class="STYLE2">系统所征收系统税收</span>时，系统会宣布店铺倒闭。店铺赚到的钱会优先补充到本金中，所以保持店铺持续盈利是最好的维护店铺的方法，在本金不足时也可以用自己的钱充入本金来救急。</p>
