<p class="STYLE2">如果您对您镶嵌在装备上的宝石不满意，也可以找洛阳－彭怀玉（177，184）、楼兰－克里木（75，162）或束河古镇－荆嵌实（135，85）将它摘除下来，不过宝石会有消失的危险哦！<br>
宝石摘除条件：没有宝石摘除符将无法摘除宝石。要放置带有宝石的装备才可以进行摘除。<br>
宝石摘除后，对应的孔将会变空。<br>
为了提升玩家对镶嵌的热情和对高等级宝石的追求，玩家可以选择使用     &quot;高级宝石摘除符&quot; ，摘除宝石后，宝石的等级不下降，但是宝石强制绑定在玩家身上。</p>
