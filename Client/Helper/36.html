<p class="STYLE7">  <strong><img src="arrow.gif" width="19" height="18" align="absmiddle"></strong><span class="STYLE5">任务道具</span><br>
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;任务类道具是指在完成特定任务的过程中需要使用的特定道具。如新手任务中的推荐信等。任务道具放置在物品栏“任务”栏中。任务道具不可整理和丢弃。</p>
<p class="STYLE7">  <strong><img src="arrow.gif" width="19" height="18" align="absmiddle"></strong><span class="STYLE5">销毁任务道具</span><br>
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;任务类道具是不可以丢弃的，如果你有删除任务道具的需求，可以在洛阳城找到孔宗渊[265，44]，打开销毁任务道具界面。<br>
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;打开销毁任务道具界面后，把任务道具栏中的任务道具用鼠标拖拽到销毁框中，点“销毁”，就可以销毁任务道具了。
