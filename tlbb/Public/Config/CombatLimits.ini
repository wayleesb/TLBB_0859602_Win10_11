# 战斗属性上限配置；当前数值保留原服的容量和公式限制。
# 提高上限只是允许容纳更大的数值，实际属性仍由装备、技能和数值表决定。
# 本文件不控制经验、货币、等级、移动速度、攻击速度或技能持续时间。
#
# 修改规则：
# 1. 七个配置项必须齐全且各出现一次，键名区分大小写，值填写十进制正整数。
# 2. 注释单独以 # 或 ; 开头，不要把注释放在数值后面，也不要添加节名。
# 3. 服务端启动时读取本文件；修改数值后需重启相关服务，不支持在线热更新。
# 4. 客户端 Data/Config/CombatLimits.ini 的数值须同步，修改后重启客户端。
# 5. GM 工具读取所选服务端资源中的本文件；修改后重新加载资源或重启工具。
# 6. 调低上限前须核对已有存档；相关字段超限会拒绝装载，不会自动缩小旧数据。
# 7. 文件保持 UTF-8 无 BOM；每行应少于 255 字节，较长注释请拆成多行。

# 原始战斗属性的容量上限，单位为对应属性的“点数”。
# 用于人物、珍兽、怪物的宽属性计算，以及相关存档、加点和输入范围校验。
# 涉及血量、内力、五项基础属性、攻防、潜能点、珍兽资质等。
# 允许负修正的计算范围为 -本值～本值；血量等非负字段仍保留各自下限。
# 命中、会心显示和抗性还受下方独立限制，不能只提高本项就视为全部放开。
# 合法范围：1～1000000000000（1 万亿）；当前 2147483647 为原有 32 位正数上限。
RawAttribute=10000000000

# 物品单条属性的绝对值上限，单位为该条属性原有的数值单位。
# 用于装备附加属性、宝石属性、暗器五项附加属性的生成、读写及存档校验。
# 支持正负数，范围为 -本值～本值；不是整件装备所有属性之和的上限。
# 提高本项不会自动提高装备生成表中的数值，也不会扩大暗器经验上限。
# 合法范围：1～1000000000000，且不得大于 RawAttribute；当前保留 32767。
ItemAttribute=32767

# 普通战斗中单次结算量的绝对值上限，单位为生命或内力点数。
# 限制伤害分量、合并后的伤害，以及启用单次限制的加减血、加减蓝。
# 结算量按 -本值～本值限制；最终余额仍受零值、最大血量或最大内力约束。
# 不用于累计伤害统计；固定技能消耗、强制击杀等明确绕过该限制的路径除外。
# 客户端怪物五倍飘字属于显示倍率，不由本项再次截断。
# 合法范围：1～1000000000000；当前保留 2147483647。
SingleSettlement=2147483647

# 会心攻击、会心防御的面板及属性同步上限，单位为会心属性点数。
# 显示校验范围为 0～本值；9999 不是 9999% 的会心概率。
# 实际会心计算仍使用原始攻防值及 C0/C1/C2 等参数，本项不修改概率公式。
# 合法范围：1～2147483647；当前保留 9999。
CriticalDisplay=9999

# 命中、闪避进入命中公式前，各自允许使用的最大属性点数。
# 双方先分别限制到 1～本值，再计算 100×命中/(命中+闪避)，最后应用 H0 下限。
# 属性同步也使用此限制；它不是命中率百分比，也不保证命中率达到 100%。
# 提高本项会让更高的命中、闪避参与计算，可能改变原有战斗结果。
# 合法范围：1～2147483647；当前保留 100000。
HitFormula=100000

# 冰、火、玄、毒四系抗性及“降低目标抗性”的属性校验上限，单位为抗性点数。
# 抗性限制在 -本值～本值；降低目标抗性限制在 0～本值。
# 用于属性同步和属性伤害计算前的校验；实际减伤还受 EffectiveResistance 限制。
# 负抗性保留原有增伤分支，不按下方的非负有效抗性范围处理。
# 合法范围：1～2147483647；当前为抗性 -4096～4096、降低目标抗性 0～4096。
Resistance=4096

# 属性伤害公式中的非负有效抗性上限，每 1 点对应减少该系伤害的 1 个百分点。
# 当校验后的抗性非负时，先减去攻击者的降低目标抗性，再限制到 0～本值。
# 该系伤害按“属性攻击×(100-有效抗性)/100”计算；负抗性另走原有分支。
# 当前为 100：有效抗性达到 100 时，该系属性伤害分量可降为 0。
# 例如改为 80，则本公式最多减免该系属性伤害的 80%，不表示整次攻击都减免 80%。
# 合法范围：1～100；单纯扩展属性容量时建议保留当前值。
EffectiveResistance=100
