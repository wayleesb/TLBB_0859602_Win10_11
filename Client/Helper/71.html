<p class="STYLE19"><span class="STYLE25"><img src="arrow.gif" width="19" height="18" align="absmiddle">蹴鞠大赛介绍<br>
</span><br>
每个月第一个星期日的下午19点到晚上23点之间，蹴鞠大赛就将在洛阳城牡丹碗拉开帷幕。只要你的等级和心法都高于30级，你就可以加入一支3人以上的队伍，去找洛阳—童贯（205，58）报名参赛。  蹴鞠大赛的报酬可是十分丰厚的啊，进去之前千万要领好双倍经验，带好各种药品。<br>
