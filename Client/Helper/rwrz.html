<p class="STYLE4">  <strong><img src="arrow.gif" width="19" height="18" align="absmiddle"></strong><span class="STYLE5">任务日志<br>
</span></p>
<p class="STYLE4">当您进入游戏以后，点击ALT+Q，就会弹出一个界面，这个界面就是任务日志。</p>
<p class="STYLE4">任务日志是提示你的任务接受，实施过程，完成情况以及任务备忘功能。</p>
<p class="STYLE4">您发现日志上有两个按钮了吗？</p>
<p class="STYLE4">当前任务，可接任务。</p>
<p class="STYLE4"><strong><img src="arrow.gif" width="19" height="18" align="absmiddle"></strong><span class="STYLE5">当前任务</span></p>
<p class="STYLE4">当前任务栏里所记载的任务是指您现在拥有的任务，未完成或者完成了还没有去领取您的奖励的任务。</p>
<p class="STYLE4"><strong><img src="arrow.gif" width="19" height="18" align="absmiddle"></strong><span class="STYLE5">可接任务</span></p>
<p class="STYLE4">可接任务栏里所记载的任务是适合您现在的等级去接受的任务，里面是我们为您精心准备的任务，您还等什么，快去试试看吧！</p>
<p class="STYLE4">&nbsp;</p>
