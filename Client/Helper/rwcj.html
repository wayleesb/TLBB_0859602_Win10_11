<p class="STYLE2">下面是几个场景的任务示例，快去接吧！</p>
<p class="STYLE2"><br>

    </span></p>
<p><span class="STYLE2"><strong>高山白猿</strong>：</span></p>
<p class="STYLE2">任务等级：1</p>
<p class="STYLE2">任务目标：无量山辕门坝的大商人马五德要求你杀死8只高山白猿。辕门坝的西南边就有很多的高山白猿[86，160]。</p>
<p class="STYLE2"><strong><img src="arrow.gif" width="19" height="18" align="absmiddle"></strong><span class="STYLE3">嵩山：</span></p>
<p><span class="STYLE2"><strong>白额虎</strong>：</span></p>
<p class="STYLE2">任务等级：15</p>
<p class="STYLE2">任务目标：嵩山嵩阳书院的柴进要求你杀死16只白额虎。箕山坡南边就有很多的白额虎。</p>

<p class="STYLE2">任务目标：在西湖虎跑村中找到苏飞[164，262]。</p>
