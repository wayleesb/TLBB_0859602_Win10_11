<p class="STYLE4"><strong><img src="arrow.gif" width="19" height="18" align="absmiddle"> <span class="STYLE3">珍兽综述</span> </strong></p>

<p class="STYLE4">	天龙八部为玩家准备了多种多样的珍兽，从常见小猫小狗到传说中的蛟龙麒麟，玩家可以选择自己喜爱的珍兽成为自己的伙伴，一起在天龙八部的世界里冒险。<br>
</p>
<p class="STYLE4"><strong><img src="arrow.gif" width="19" height="18" align="absmiddle"> <span class="STYLE3">玄武岛</span> </strong></p>
<p class="STYLE4">玄武岛里玩家可以找到自己需要的珍兽，这里的怪物虽然和珍兽的外形一样，但是他们是不能直接捕捉的，有的甚至会向玩家发动攻击。玩家需要杀死这些怪物后，有一定几率会出现和怪物类型一样的珍兽，此时玩家就可以捕捉了。<br>
</p>
<p class="STYLE4"><br>
