<p class="STYLE2">人物的包裹一共有三类，分别为道具、材料和任务。<br>
  <br>
    <span class="STYLE3"><strong><img src="arrow.gif" width="19" height="18" align="absmiddle"></strong>道具包裹<br>
  </span>所有的武器装备、药品食物、普通道具等物品都是放在这包裹中，人物可以装备行囊来增加道具栏的容量；<br>
  <span class="STYLE3"><br>
  <strong><img src="arrow.gif" width="19" height="18" align="absmiddle"></strong>材料包裹<br>
  </span>所有的生活技能材料、打造图等都是放在这个包裹中，人物可以装备格箱来增加材料栏的容量；<br>
  <br>
  <span class="STYLE3"><strong><img src="arrow.gif" width="19" height="18" align="absmiddle"></strong>任务包裹</span><br>
所有的任务道具都放在这个包裹中。</p>
