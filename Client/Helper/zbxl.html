<p class="STYLE2"><span class="STYLE1"><img src="arrow.gif" width="19" height="18" align="absmiddle"></span>装备修理</p>
<p class="STYLE3">装备使用的时间过长，耐久度就会下降，如果装备的耐久度下降为0，那么这件装备即使装备在身上也不会起作用了，所以需要进行修理。40级以下的装备可以在任何NPC商人处进行修理，而40级以上的装备则必须找苏州-薛菲（255，151）进行修理，且会有一定几率修理失败。当然，越高级的装备修理起来就越费劲，如果装备的修理失败次数到3的时候，那么这件装备将会直接消失，所以在修理高级装备的时候请小心，如果担心它会因修理失败而消失，可以找苏州的欧冶子（266，140）减少修理失败次数。</p>
