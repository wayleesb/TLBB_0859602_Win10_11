<p class="STYLE3">其他信息分栏中包含以下内容：善恶、杀气、门派贡献度、帮派贡献度、本周剩余双倍时间等。</p>
<p class="STYLE3">在其他分栏中还可以查看排行榜及其声望界面，而且进入此界面后你会发现行囊和格箱两项，如果你现在发现此处装备了行囊或者格箱，从这里点击它们并拖入包裹中，你会发现你的行囊和格箱的容量减少了。</p>
