<h1 class="ArtTitle STYLE1 STYLE2"><strong><img src="arrow.gif" width="19" height="18" align="absmiddle"></strong><span class="STYLE3">玩家信息</span></h1>
<p class="STYLE3">右键点击玩家在聊天频道中的角色名称，查看其资料，可以打开玩家信息栏，该信息栏中可以查看：</p>
<p class="STYLE3">所查玩家创建角色时的唯一ID、角色名称、角色等级、门派、玩家所选头像、帮会名称、心情、称号等各种信息，便于你了解他（她）并考虑是否加其为好友。</p>
<p class="STYLE3">在本信息栏中还有针对查看的玩家加好友及其进行私聊的功能。</p>
