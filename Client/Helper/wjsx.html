<span class="ArtTitle STYLE2">玩家装备信息栏</span>
<p><span class="STYLE3"><span class="STYLE5"><strong><img src="arrow.gif" width="19" height="18" align="absmiddle"></strong>装备栏</span><br>
</span><span class="STYLE6">用于放置头盔、武器、护甲、项链、坐骑、护符、护肩、护腕、鞋子、腰带、戒指等装备。 </span></p>
<p class="STYLE6"><span class="STYLE8"><img src="arrow.gif" width="19" height="18" align="absmiddle">属性栏</span><br>
  包含：外功攻击力、
  内功攻击力、
  外功防御、
  内功防御、
  闪避、
  命中、
  会心攻击、
会心防御。<br>
<br>
力量：主要影响角色的外功攻击。<br>
灵气：主要影响角色的内功攻击。<br>
  体力：影响角色的HP、HP回复、外功防御。<br>
  定力：影响角色的MP、MP回复、内功防御。<br>
  身法：影响角色的闪避、命中、会心率。<br>
潜能：可用以分配一级战斗属性。	<br>
<br>
还包括活力、精力、等级和门派。</p>
