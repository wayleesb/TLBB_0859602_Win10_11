<p class="STYLE4">  <strong><img src="arrow.gif" width="19" height="18" align="absmiddle"></strong><span class="STYLE5">挑战</span><br>
1.挑战就是切磋武艺，是一种没有任何损失的玩家与玩家之间的比试武艺的行为。<br>
2.挑战只有在大理的尚武台（96，210）和洛阳的校场（90，172）才可以进行。<br>
3.右键点击一个玩家，从菜单中选择“挑战”，该玩家收到挑战的询问，同意后，两人一起进入单独的比武擂台进行战斗。刚刚进入擂台时是不能攻击对方的，比武正式开始后，双方才能互相攻击。一方血减少到0时，比武结束，双方自动退出擂台。<br>
4.玩家组队后可以进行组队比武，需要一队的队长右键点击另一队的队长，从菜单中选择“挑战”，对方队长同意后双方队员一起自动进入擂台。规则与单人比武类似，在一方血都降为0时，比武结束。</p>
