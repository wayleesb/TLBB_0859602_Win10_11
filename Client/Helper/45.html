<h1 class="ArtTitle STYLE1 STYLE2">玩家死亡</h1>
<p class="STYLE3">玩家死亡后，画面灰化，会弹出界面，询问玩家是否灵魂出窍。</p>
<p><span class="STYLE3"><span class="STYLE4"><span class="STYLE6"><strong><img src="arrow.gif" width="19" height="18" align="absmiddle"></strong>新手死亡 </span><br>
  普通死亡（等级为1~9的玩家在打怪时死亡），可原地复活，也可等待其他玩家复活。如果您点击出窍则复活后回到新手出生点。</span></span><span class="STYLE3"><span class="STYLE4"><br>
  <br>
  <span class="STYLE7"><strong><img src="arrow.gif" width="19" height="18" align="absmiddle"></strong>非新手死亡 <br>
</span></span></span><span class="STYLE3">死亡后灵魂出窍进入地府，也可等待其他玩家复活。</span></p>
<p class="STYLE3"><span class="STYLE7"><strong><img src="arrow.gif" width="19" height="18" align="absmiddle"></strong>地府限制</span><br>
  地府只允许聊天、和传送NPC对话。<br>
  禁止：使用技能、使用道具、交易、摆摊、骑乘、仇杀。 </p>
