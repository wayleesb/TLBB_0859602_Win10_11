<h1 class="ArtTitle STYLE1 STYLE2">关于小地图</h1>
<p class="STYLE3">小地图位于游戏右上角部分，包含很多功能。</p>
<p class="STYLE3"><span class="STYLE4"><strong><img src="arrow.gif" width="19" height="18" align="absmiddle"></strong>指北</span><br>
可使玩家前进区域指向北方。</p>
<p class="STYLE3"><span class="STYLE4"><strong><img src="arrow.gif" width="19" height="18" align="absmiddle"></strong>打开江湖指南</span><br>
江湖指南中会告诉各位玩家各个等级可以和需要做的各种事情或者任务。</p>
<p class="STYLE3"><span class="STYLE4"><strong><img src="arrow.gif" width="19" height="18" align="absmiddle"></strong>打开帮助</span><br>
进入游戏帮助首页，玩家可以查询有戏中有疑问的问题。</p>
<p class="STYLE3"><span class="STYLE4"><strong><img src="arrow.gif" width="19" height="18" align="absmiddle"></strong>打开区域地图</span><br>
  即打开本场景地图，便于玩家寻找NPC及其各个场地，打开场景地图时，点击场景地图右下角的“切换至世界地图”按钮，或者使用ALT+M键即可切换到世界地图。</p>
<p class="STYLE3"><span class="STYLE4"><strong><img src="arrow.gif" width="19" height="18" align="absmiddle"></strong>打开世界地图</span><br>
  打开世界地图后可以查询各个场景的名称及其怪物的等级，打开世界地图时，点击世界地图右下角的“切换至场景地图”按钮，或者使用TAB快捷键即可切换到当前场景地图。</p>
