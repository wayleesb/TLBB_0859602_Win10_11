        <p>账号仅用于本服务器的游戏登录。请妥善保管账号密码、超级密码和注册邮箱。</p>
        <p>不得利用游戏或账号系统从事破坏服务器运行、影响其他玩家或违反法律法规的行为。</p>
        <p>因共享账号、泄露密码或使用非官方程序造成的损失，由账号使用者自行承担。</p>
        <p>提交注册即表示您理解并同意以上条款。</p>
