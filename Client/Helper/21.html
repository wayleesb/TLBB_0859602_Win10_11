<p class="STYLE8">    <strong><img src="arrow.gif" width="19" height="18" align="absmiddle"></strong><span class="STYLE6">漕运</span><br>
  大理、洛阳、苏州三大城市各有漕运使一名，（大理王若禹[54,192]，洛阳赵明诚[228,175]，苏州陆士铮[236,78]）。和他们对话，领取官票，你就成为大宋民间漕运使了。</p>
<p class="STYLE8">往来于三大城市，通过买卖物品，赚取物品的差价，为你完成富甲天下梦想踏出第一步。</p>
<p class="STYLE8">记住城市之间的货商和黑市，可以帮助你，打压市场和哄抬物价，可以让你事半功倍。</p>
<p class="STYLE8">开始漕运任务后，不可以使用城市中的驿站。<br>
</p>
