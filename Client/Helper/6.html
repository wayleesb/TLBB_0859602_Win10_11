<p class="STYLE6">《天龙八部》有着极为强大的帮会系统，在这里你可以体验到丰富多彩的帮会生活。	</p>
<p class="STYLE5"><span class="STYLE5"><span class="STYLE3"><strong><img src="arrow.gif" width="19" height="18" align="absmiddle"></strong>帮会领地申请条件</span></span>
</p>
<p>1.申请人身份为一个0级帮会的帮主。<br>
2.申请领地需要花费1000两黄金或者上交一个建城令牌。</p>
<p><span class="STYLE5"><span class="STYLE3"><strong><img src="arrow.gif" width="19" height="18" align="absmiddle"></strong>帮会领地申请列表</span></span>
</p>
<span class="STYLE5">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<br>
</span><span class="STYLE5">·选中一个领地之后，可以在右边的显示框中看到这个领地的名称、所属商业区域、特产等属性。<br>
·如果领地名称是红色，说明这块领地已经被别的帮会占领。
  </p>
